name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
      - run: dotnet restore IOScene.slnx
      - run: dotnet build IOScene.slnx -c Release --no-restore
      - run: dotnet test IOScene.slnx -c Release --no-build
      - run: dotnet pack IOScene.slnx -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/*.nupkg
          if-no-files-found: error
      # System.Text.Json calls setters through reflection on a runtime without dynamic code.
      - name: Test without dynamic code
        run: dotnet test IOScene.slnx -c Release -p:DynamicCodeSupport=false
